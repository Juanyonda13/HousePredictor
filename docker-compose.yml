version: '3.8'

services:
  prediccion-casas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prediccion-casas-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
      - ./model/artifacts:/app/model/artifacts
      - ./graficas_estadisticas:/app/graficas_estadisticas:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - webproxy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  webproxy:
    external: true

